<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paritorio">
<meta name="theme-color" content="#06080E">
<title>Paritorio en primera persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único de videojuego: noche de paritorio, HUD de cristal oscuro con acentos cian (datos), rosa (contracción) y lima (bien) */
  --bg:#06080E; --panel:rgba(9,14,26,.74); --panel2:rgba(20,30,50,.85); --line:rgba(110,210,255,.28);
  --text:#EAF6FF; --muted:#8EA2B8; --cyan:#4FE3FF; --pink:#FF4F8B; --lime:#A6FF6B; --amber:#FFC94F; --red:#FF5A5A;
  --hud:"Chakra Petch","Arial Narrow",system-ui,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;container-type:size;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{--u:min(1cqw,1.7778cqh);position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);overflow:hidden;background:#000;font-size:calc(var(--u)*1.25);border-radius:calc(var(--u)*.6)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#tint,#vig,#flash{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 55%,transparent 35%,rgba(255,30,80,.55) 100%);opacity:0;mix-blend-mode:screen}
#tint{background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.7) 100%)}
#flash{background:#fff;opacity:0;transition:opacity 1.2s}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:.7em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 .4em 1.4em rgba(0,0,0,.35)}
.lbl{font-family:var(--hud);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--hud);font-variant-numeric:tabular-nums;font-weight:700}
/* arriba izquierda */
#hudTL{left:1.2%;top:2%;width:23%;padding:.6em .8em;display:flex;flex-direction:column;gap:.25em}
#phaseName{font-family:var(--hud);font-weight:700;font-size:1.25em;line-height:1.05;color:var(--cyan)}
#phaseSub{font-size:.78em;color:var(--muted)}
#clockRow{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}
#clock{font-size:1.6em}
#phaseTime{font-size:.72em;color:var(--muted);text-align:right}
#ctrl{display:flex;gap:.35em;margin-top:.2em}
.mini{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--hud);font-weight:600;font-size:.72em;padding:.3em .55em;border-radius:.45em;cursor:pointer}
.mini.on{border-color:var(--cyan);color:var(--cyan)}
/* monitor */
#monitor{left:1.2%;top:23%;width:25%;height:33%;padding:.45em .55em .5em;display:flex;flex-direction:column;gap:.2em;background:rgba(4,10,16,.86);border-color:rgba(79,227,255,.35)}
#monHead{display:flex;justify-content:space-between;align-items:center}
#monBadge{font-family:var(--hud);font-size:.6em;padding:.15em .45em;border-radius:.3em;background:rgba(79,227,255,.15);color:var(--cyan);letter-spacing:.08em}
#monCanvas{flex:1;width:100%;min-height:0;display:block;border-radius:.3em}
#monNums{display:flex;justify-content:space-between;align-items:baseline;font-size:.72em;color:var(--muted)}
#fcfNum{font-size:1.7em;color:var(--lime)}
#fcfNum.warn{color:var(--amber)} #fcfNum.bad{color:var(--red)}
/* barras */
#hudL{left:1.2%;top:58%;width:19%;padding:.55em .7em;display:flex;flex-direction:column;gap:.4em}
.stat{display:grid;grid-template-columns:4.6em 1fr 2.2em;align-items:center;gap:.4em;font-size:.82em}
.stat b{font-weight:600;color:var(--muted);font-size:.9em}
.track{height:.55em;background:rgba(255,255,255,.08);border-radius:1em;overflow:hidden}
.track i{display:block;height:100%;width:50%;border-radius:1em;transition:width .3s}
.stat span{font-family:var(--hud);font-size:.92em;text-align:right;font-variant-numeric:tabular-nums}
/* arriba derecha */
#hudTR{right:1.2%;top:2%;width:19%;padding:.6em .7em;display:flex;flex-direction:column;align-items:center;gap:.25em}
#dilSvg{width:72%;height:auto;display:block}
.kv{width:100%;display:flex;justify-content:space-between;font-size:.76em;border-top:1px solid rgba(255,255,255,.07);padding-top:.25em}
.kv b{font-weight:600;color:var(--muted)}
.kv span{font-family:var(--hud);font-weight:600;text-align:right}
#cardinal{width:100%;text-align:center;font-family:var(--hud);font-size:.72em;color:var(--amber);min-height:1.2em}
/* contracción arriba centro */
#ctx{left:50%;transform:translateX(-50%);top:2%;width:30%;padding:.45em .7em;display:flex;flex-direction:column;gap:.3em}
#ctxTop{display:flex;justify-content:space-between;align-items:baseline}
#ctxState{font-family:var(--hud);font-weight:700;font-size:.95em}
#ctxTrack{position:relative;height:.9em;border-radius:1em;background:rgba(255,255,255,.07);overflow:hidden}
#ctxFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#FF7AA8,#FF2F6E);border-radius:1em}
#ctxNext{font-size:.72em;color:var(--muted)}
/* prompt central */
#prompt{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.4em;pointer-events:none;opacity:0;transition:opacity .25s}
#prompt.show{opacity:1}
#ringBox{position:relative;width:9em;height:9em;display:grid;place-items:center}
#ringGuide,#ringYou{position:absolute;border-radius:50%;inset:0;margin:auto}
#ringGuide{border:.25em solid rgba(79,227,255,.9);box-shadow:0 0 1.2em rgba(79,227,255,.6)}
#ringYou{background:rgba(166,255,107,.25);border:.15em solid rgba(166,255,107,.8)}
#ptext{font-family:var(--hud);font-weight:700;font-size:1.35em;text-shadow:0 .1em .5em #000;text-align:center;white-space:nowrap}
#psub{font-size:.85em;color:#D7E9FF;text-shadow:0 .1em .4em #000;text-align:center;max-width:24em}
#gauge{position:relative;width:16em;height:1.1em;border-radius:1em;background:rgba(0,0,0,.55);border:1px solid var(--line);overflow:hidden;display:none}
#gauge .z{position:absolute;top:0;bottom:0;left:26%;width:49%;background:rgba(166,255,107,.28)}
#gauge .z2{position:absolute;top:0;bottom:0;left:75%;right:0;background:rgba(255,90,90,.25)}
#gFill{position:absolute;inset:0 auto 0 0;width:0;background:var(--cyan)}
/* bocadillo */
#bubble{position:absolute;left:52%;top:17%;max-width:27%;padding:.55em .8em;background:rgba(250,252,255,.95);color:#13202E;border-radius:.8em .8em .8em .15em;font-size:.88em;line-height:1.3;font-weight:500;opacity:0;transform:translateY(.4em);transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 .4em 1.2em rgba(0,0,0,.4)}
#bubble.show{opacity:1;transform:none}
#bubble b{display:block;font-family:var(--hud);font-size:.72em;letter-spacing:.12em;color:#0E8C8A;text-transform:uppercase}
#toast{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-family:var(--hud);font-weight:700;font-size:1.05em;padding:.3em .8em;border-radius:.5em;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
/* acciones */
#bar{position:absolute;left:21.5%;right:15.5%;bottom:2.2%;display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;align-items:flex-end}
.act{appearance:none;position:relative;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--text);font-family:var(--hud);font-weight:600;font-size:.78em;padding:.45em .6em .4em;border-radius:.55em;cursor:pointer;min-width:6.6em;display:flex;flex-direction:column;align-items:center;gap:.1em;line-height:1.05;transition:transform .12s,border-color .12s}
.act .ic{font-size:1.35em;line-height:1}
.act .k{position:absolute;top:.2em;left:.35em;font-size:.65em;color:var(--muted)}
.act:hover:not(:disabled){transform:translateY(-.15em);border-color:var(--cyan)}
.act.cur{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.act.hot{border-color:var(--amber)}
.act:disabled{opacity:.33;cursor:not-allowed}
#holdWrap{position:absolute;right:1.4%;bottom:2.4%;display:flex;flex-direction:column;align-items:center;gap:.5em}
#hold,#pant{appearance:none;border:0;border-radius:50%;font-family:var(--hud);font-weight:700;color:#06121D;cursor:pointer;touch-action:none}
#hold{width:7.4em;height:7.4em;font-size:1em;background:radial-gradient(circle at 40% 35%,#9BF3FF,#22B5D8);box-shadow:0 0 0 .3em rgba(79,227,255,.25),0 .4em 1.4em rgba(0,0,0,.5)}
#hold.push{background:radial-gradient(circle at 40% 35%,#FF9DC0,#FF2F6E)}
#hold.down{transform:scale(.94);box-shadow:0 0 0 .5em rgba(166,255,107,.5)}
#hold small{display:block;font-size:.62em;opacity:.75;font-weight:600}
#pant{width:5em;height:5em;background:radial-gradient(circle at 40% 35%,#FFF0A8,#FFB21F);display:none}
/* modal */
#modal{position:absolute;inset:0;background:rgba(3,6,12,.62);display:none;align-items:center;justify-content:center;z-index:40}
#modal.show{display:flex}
.mbox{width:min(62%,46em);max-height:90%;overflow:auto;background:rgba(10,16,30,.96);border:1px solid var(--line);border-radius:1em;padding:1.1em 1.3em;display:flex;flex-direction:column;gap:.7em;box-shadow:0 1em 3em rgba(0,0,0,.6);animation:mIn .3s ease-out}
@keyframes mIn{from{transform:scale(.96);opacity:0}}
.mtag{font-family:var(--hud);font-size:.68em;letter-spacing:.16em;color:var(--pink);text-transform:uppercase;font-weight:700}
.mbox h2{margin:0;font-family:var(--hud);font-size:1.45em;line-height:1.1;text-wrap:balance}
.mbox p{margin:0;line-height:1.4;font-size:.95em}
.opts{display:flex;flex-direction:column;gap:.45em}
.opt{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--body);font-size:.92em;font-weight:600;padding:.6em .8em;border-radius:.6em;cursor:pointer;display:flex;gap:.6em;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt .l{font-family:var(--hud);color:var(--cyan);min-width:1.1em}
.opt.sel{border-color:var(--cyan);background:rgba(79,227,255,.12)}
.opt.ok{border-color:var(--lime);background:rgba(166,255,107,.12)}
.opt.ko{border-color:var(--red);background:rgba(255,90,90,.12)}
.opt:disabled{cursor:default}
.fb{border-radius:.6em;padding:.6em .8em;font-size:.9em;line-height:1.4}
.fb.ok{background:rgba(166,255,107,.1);border:1px solid rgba(166,255,107,.45)}
.fb.ko{background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.45)}
.fb.info{background:rgba(79,227,255,.08);border:1px solid var(--line)}
.fb strong{font-family:var(--hud)}
.btn{appearance:none;border:0;border-radius:.6em;padding:.6em 1.1em;font-family:var(--hud);font-weight:700;font-size:.95em;cursor:pointer;background:var(--cyan);color:#04121A}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.mchart{width:100%;height:auto;background:#050B12;border-radius:.5em;border:1px solid rgba(79,227,255,.25)}
.cordBar{height:1em;border-radius:1em;background:rgba(255,255,255,.08);overflow:hidden}
.cordBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4FE3FF,#A6FF6B)}
/* pantallas */
#screen{position:absolute;inset:0;z-index:30;display:none;overflow:auto;background:radial-gradient(ellipse at 30% 20%,#13284A,#05070D 70%)}
#screen.show{display:block}
.scr{min-height:100%;padding:2.2em 3em;display:flex;flex-direction:column;gap:1em}
.title{font-family:var(--hud);font-weight:700;font-size:3.4em;line-height:.95;margin:0}
.title span{color:var(--pink)}
.sub{color:#C8D7E8;font-size:1.05em;max-width:42em;margin:0;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:.8em;padding:.8em 1em;display:flex;flex-direction:column;gap:.5em}
.card h3{margin:0;font-family:var(--hud);font-size:1em;letter-spacing:.06em;color:var(--cyan)}
.card p,.card li{font-size:.9em;line-height:1.4;margin:0}
.card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:.3em}
.seg{display:flex;gap:.4em;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--hud);font-weight:600;padding:.5em .8em;border-radius:.5em;cursor:pointer;font-size:.9em}
.seg button.on{border-color:var(--lime);color:var(--lime)}
kbd{font-family:var(--hud);background:rgba(255,255,255,.1);border-radius:.3em;padding:.05em .35em;font-size:.85em}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em}
.res .card{gap:.15em}
.res .v{font-family:var(--hud);font-size:1.5em;font-weight:700}
.res .r{font-size:.75em;color:var(--muted)}
.good{color:var(--lime)} .meh{color:var(--amber)} .badc{color:var(--red)}
#rot{position:fixed;inset:0;z-index:60;background:#05070D;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-family:var(--body)}
#rot.show{display:flex}
#rot .ph{width:64px;height:110px;border:4px solid #4FE3FF;border-radius:14px;animation:turn 2s ease-in-out infinite}
@keyframes turn{40%,60%{transform:rotate(90deg)}}
#rot button{font-size:16px}
/* svg anim */
.bob{animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(8px)}}
.water line{animation:wfall .6s linear infinite}
@keyframes wfall{from{transform:translateY(-120px);opacity:0}20%{opacity:.8}to{transform:translateY(260px);opacity:0}}
.steam{animation:steam 4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(40px)}50%{opacity:.35}100%{opacity:0;transform:translateY(-80px)}}
.blink{animation:blinkA 4s infinite}
@keyframes blinkA{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.babyBreath{animation:bb 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bb{50%{transform:scale(1.025)}}
#cam,#fgL{transition:transform 1s cubic-bezier(.4,.1,.2,1)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
button:focus-visible{outline:.15em solid var(--amber);outline-offset:.15em}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="wallH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F566E"/><stop offset="1" stop-color="#2C3E52"/></linearGradient>
      <linearGradient id="floorH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3646"/><stop offset="1" stop-color="#151C26"/></linearGradient>
      <linearGradient id="wallC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A4466"/><stop offset="1" stop-color="#3B2D48"/></linearGradient>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0" stop-color="#1B1D3F"/><stop id="sky2" offset="1" stop-color="#3D3570"/></linearGradient>
      <linearGradient id="sheetG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F0F6"/><stop offset="1" stop-color="#AFC0D0"/></linearGradient>
      <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".5"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></linearGradient>
      <radialGradient id="bellyShade" cx=".5" cy=".25" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="#FFD98A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD98A" stop-opacity="0"/></radialGradient>
      <pattern id="gown" width="46" height="46" patternUnits="userSpaceOnUse"><rect width="46" height="46" fill="#6C8FC4"/><circle cx="12" cy="12" r="4" fill="#9CB8E2"/><circle cx="35" cy="35" r="4" fill="#9CB8E2"/></pattern>
      <pattern id="tiles" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#9EC3D3"/><path d="M0 0H80V80" fill="none" stroke="#7FA6B8" stroke-width="4"/></pattern>
      <pattern id="drape" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#2E73A8"/><path d="M0 30 Q15 20 30 30 T60 30" stroke="#28679A" stroke-width="6" fill="none"/></pattern>
    </defs>
    <g id="shake"><g id="cam" style="transform-origin:800px 450px"><g id="roomL"></g><g id="chars"></g></g><g id="fgL" style="transform-origin:800px 900px"></g><g id="overL"></g></g>
  </svg>
  <div id="vig"></div><div id="tint"></div><div id="flash"></div>

  <div id="hudTL" class="panel">
    <div class="lbl">Fase</div>
    <div id="phaseName">Fase latente</div>
    <div id="phaseSub">En casa · 2 cm</div>
    <div id="clockRow"><div id="clock" class="num">17:10</div><div id="phaseTime"></div></div>
    <div id="ctrl"><button class="mini" id="bPause">II Pausa</button><button class="mini" id="bSpeed">x1</button><button class="mini on" id="bSound">Sonido</button><button class="mini" id="bSkip">Saltar ⏭</button><button class="mini" id="bFull" title="Pantalla completa">⛶</button></div>
  </div>

  <div id="monitor" class="panel">
    <div id="monHead"><span class="lbl">RCTG · FCF / Toco</span><span id="monBadge">TELEMETRÍA</span></div>
    <canvas id="monCanvas"></canvas>
    <div id="monNums"><span><span id="fcfNum" class="num">140</span> lpm</span><span id="dynTxt" class="num">—</span></div>
  </div>

  <div id="hudL" class="panel">
    <div class="stat"><b>Dolor</b><div class="track"><i id="sPain" style="background:var(--pink)"></i></div><span id="vPain">0</span></div>
    <div class="stat"><b>Aguante</b><div class="track"><i id="sAg" style="background:var(--cyan)"></i></div><span id="vAg">100</span></div>
    <div class="stat"><b>Energía</b><div class="track"><i id="sEn" style="background:var(--amber)"></i></div><span id="vEn">80</span></div>
    <div class="stat"><b>Bebé</b><div class="track"><i id="sBb" style="background:var(--lime)"></i></div><span id="vBb">88</span></div>
    <div id="badges" style="display:flex;flex-wrap:wrap;gap:.3em"></div>
  </div>

  <div id="hudTR" class="panel">
    <svg id="dilSvg" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#FFC94F" stroke-opacity=".35" stroke-width="10" stroke-dasharray="125.7 314.2" transform="rotate(-90 60 60)"/>
      <circle id="dilArc" cx="60" cy="60" r="50" fill="none" stroke="#4FE3FF" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 314.2" transform="rotate(-90 60 60)"/>
      <text id="dilTxt" x="60" y="62" text-anchor="middle" font-family="Chakra Petch" font-weight="700" font-size="30" fill="#EAF6FF">2</text>
      <text x="60" y="80" text-anchor="middle" font-family="Chakra Petch" font-size="11" fill="#8EA2B8">cm de 10</text>
    </svg>
    <div class="kv"><b>Borramiento</b><span id="kvEff">50 %</span></div>
    <div class="kv"><b>Estación</b><span id="kvSt">−3</span></div>
    <div class="kv"><b>Posición</b><span id="kvOcc">OIIA</span></div>
    <div class="kv"><b>Bolsa</b><span id="kvBag">Íntegra</span></div>
    <div id="cardinal"></div>
  </div>

  <div id="ctx" class="panel">
    <div id="ctxTop"><span class="lbl">Contracción</span><span id="ctxState">En reposo</span></div>

function fitCanvas(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(10,r.width*d);cv.height=Math.max(10,r.height*d);}

function fcfNow(time){
  let base=G.fever?166:142;if(G.hypo)base=92;

    if(ty==='tardia'&&p>.45){d=-26*Math.sin(Math.PI*clamp((p-.45)/.9,0,1));MON.lateTail=1.4;}}
  if(G.decel&&G.decel.type==='tardia'&&p==null&&MON.lateTail>0){d=-26*Math.sin(Math.PI*clamp(.61+(1.4-MON.lateTail)/1.4*.39,0,1));}

/* audio */

/* ===================== ciclo de contracciones ===================== */
function params(){
  if(G.phase==='latente')return {M:30,P:3.4,C:5.5,amp:clamp(.3+.12*(G.cm-2),.3,.65)};
  if(G.phase==='activa')return {M:12,P:3.0,C:6.5,amp:clamp(.62+.07*(G.cm-5)+(G.oxy?.08:0),.6,1)};
  if(G.phase==='pasivo')return {M:10,P:2.4,C:6,amp:.95};
  return {M:5,P:2.8,C:8,amp:1};
}
const POST={
  prog:{pie:1.25,pelota:1.2,cuadrupedia:1.1,ducha:1.1,lateral:.95,cama:.95,supina:.65,sofa:1},
  pain:{pie:.95,pelota:.9,cuadrupedia:.92,ducha:.72,lateral:.95,cama:1,supina:1.15,sofa:1},
  push:{lateral:1,cuclillas:1.2,cama:.95,cuadrupedia:1.05,supina:.8},
  tear:{lateral:.7,cuadrupedia:.8,cama:1,cuclillas:1.15,supina:1.35}
};
function painMod(){let m=POST.pain[G.posture]??1;
  if(G.occ==='OP'){m*=1.12;if(G.posture==='cuadrupedia'||G.posture==='pelota')m*=.88;}
  if(G.epi==='on')m*=.12;else if(G.epi==='onset')m*=.55;
  if(G.pcea>0)m*=.7;if(G.massage>0)m*=.85;if(G.n2o)m*=.7;if(G.opioid>0)m*=.75;if(G.tens&&G.cm<6)m*=.88;if(G.oxy)m*=1.12;if(G.aguante<25)m*=1.1;return m;}
function cycleInfo(){ // frecuencia mostrada
  if(G.phase==='latente'){const l=G.intervals[G.intervals.length-1];return l?{txt:`cada ${l.i} min · ${l.d} s`,f:10/l.i}:{txt:'irregulares',f:1};}
  if(G.phase==='activa'){const iv=clamp(lerp(4,2.6,(G.cm-5)/5)-(G.oxy?.6:0),2,5);const f=10/iv;const mm=Math.round(lerp(32,48,(G.cm-5)/5)+(G.oxy?5:0));return {txt:`${f.toFixed(1).replace('.',',')}/10 min · ${mm} mmHg · ${Math.round(f*mm)} UM`,f,iv};}
  return {txt:'4–5/10 min · pujos',f:4.5,iv:2.3};
}

function tick(dt){
  if(!G.started||G.paused||G.modal||G.cine||G.over)return;
  dt*=G.speed;
  const pr=params(),c=G.cyc;c.t+=dt;
  if(G.phase==='alumbramiento'||G.phase==='puerperio')return;
  if(c.st==='p'){
    G.t+=(pr.M-1)*dt/pr.P;
    G.pain=Math.max(0,G.pain-dt*60);
    G.aguante=clamp(G.aguante+dt*(.5+(G.posture==='lateral'?.5:0)+(G.massage>0?.4:0)),0,100);
    if(c.t>=pr.P||c.skip){c.st='c';c.t=0;c.skip=false;G.breath=0;G.ex.pushesThis=0;onContractionStart();}
  } else {
    G.t+=dt/pr.C;const p=c.t/pr.C;const s=shape(p);
    G.pain=clamp(pr.amp*100*painMod()*s*(1-.35*(G.breathOk||0)),0,100);
    if(G.phase!=='expulsivo'||G.crown)breathStep(dt,p,pr);
    if(G.phase==='expulsivo'&&!G.crown)pushStep(dt,p,s);
    if(p>=1){endContraction();}
  }
}
function onContractionStart(){
  G.breathOk=0;
  if(G.phase==='expulsivo'&&G.crown){prompt(true,'¡JADEA!','Coronación: respiraciones cortas, no empujes. Pulsa JADEA',true);}
}
let guideIn=false;
function breathStep(dt,p,pr){
  const needs=!(G.epi==='on'&&G.phase!=='latente');
  const T=pr.C/2,ph=(G.cyc.t%T)/T;guideIn=ph<.4;
  const scale=guideIn?lerp(.45,1,ph/.4):lerp(1,.45,(ph-.4)/.6);
  $('ringGuide').style.width=$('ringGuide').style.height=(scale*100)+'%';
  if(G.crown){ $('ringBox').style.display='none'; return; }
  $('ringBox').style.display='grid';
  const you=G.holding?Math.min(1,(G.youS||.45)+dt*1.4):Math.max(.45,(G.youS||.45)-dt*1);G.youS=you;
  $('ringYou').style.width=$('ringYou').style.height=(you*100)+'%';
  if(G.holding===guideIn)G.breath+=dt;
  G.breathOk=clamp(G.breath/Math.max(.5,G.cyc.t),0,1);
  if(!needs)prompt(true,'Epidural activa','La contracción apenas se nota. Puedes descansar');
  else if(G.epi==='placing')prompt(true,guideIn?'INSPIRA · quieta':'SUELTA · quieta','Te están poniendo la epidural: no te muevas durante la contracción');
  else prompt(true,guideIn?'INSPIRA':'SUELTA EL AIRE',guideIn?'Por la nariz, mantén pulsado':'Por la boca, despacio · suelta el botón');
}
function pushStep(dt,p,s){
  $('ringBox').style.display='none';
  const urge=s>.25;
  prompt(true,urge?(G.holding?'¡EMPUJA! suelta el aire':'GANAS DE EMPUJAR'):'Contracción llegando…',urge?'Mantén pulsado mientras empujas y suelta en la zona verde · 3–4 pujos':'Espera a que suba',false,true);
  if(G.holding){G.holdT+=dt;$('gFill').style.width=clamp(G.holdT/4*100,0,100)+'%';if(G.holdT>4)releasePush(true);}

function prompt(show,t,sub,pant,gauge){$('prompt').classList.toggle('show',show);if(!show)return;$('ptext').textContent=t;$('psub').textContent=sub||'';$('gauge').style.display=gauge?'block':'none';$('pant').style.display=pant?'block':'none';}
function toast(t,col){const e=$('toast');e.textContent=t;e.style.color=col||'var(--text)';e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1300);}
function say(text,ms=4200,mood){const b=$('bubble');const who=G.loc==='casa'?'Tu pareja':G.loc==='quirofano'?'Equipo':'Matrona';b.innerHTML=`<b>${who}</b>${text}`;b.classList.add('show');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('show'),ms);if(mood)mwMood(mood);}

/* pujos */
function holdStart(){if(G.holding||!G.started||G.modal||G.over)return;G.holding=true;$('hold').classList.add('down');G.holdT=0;
  if(G.phase==='expulsivo'&&G.cyc.st==='c'&&G.crown){G.ex.crownPush++;toast('¡No empujes! Jadea para que salga despacio','var(--amber)');}
  if(G.phase==='expulsivo'&&G.cyc.st==='p'){toast('Sin contracción no empujes: descansa','var(--amber)');G.energy-=1;}}
function holdEnd(){if(!G.holding)return;G.holding=false;$('hold').classList.remove('down');if(G.phase==='expulsivo'&&G.cyc.st==='c'&&!G.crown)releasePush(false);G.holdT=0;$('gFill').style.width='0%';}
function releasePush(forced){
  const d=G.holdT;G.holding=forced?false:G.holding;if(forced){G.holding=false;$('hold').classList.remove('down');}

  if(s<.25){toast('Empuja con la contracción, no antes','var(--amber)');G.energy-=1;G.holdT=0;return;}
  G.ex.pushesThis++;
  const mod=(POST.push[G.posture]??1)*(G.energy<25?.7:1)*(G.epi==='on'?.85:1)*(G.occ==='OP'?.8:1)*(G.bladder?.8:1);
  if(d>=3.0||forced){G.station+=.06*mod;G.energy-=4;G.baby-=2.5;G.ex.val++;toast('Pujo demasiado largo (Valsalva): cansa más y no ayuda','var(--red)');}
  else if(d>=1.05){G.station+=.13*mod;G.energy-=1.6;G.ex.good++;toast('¡Buen pujo!','var(--lime)');}
  else {G.station+=.03*mod;G.energy-=.6;G.ex.weak++;toast('Pujo corto','var(--muted)');}

function pant(){if(G.phase==='expulsivo'&&G.crown&&G.cyc.st==='c'){G.ex.pant++;toast('Jadeo · fu-fu-fu','var(--amber)');}}

function endContraction(){
  const pr=params();const c=G.cyc;c.st='p';c.t=0;G.cycles++;prompt(false);$('pant').style.display='none';
  const bo=(G.epi==='on'&&G.phase!=='latente')?.7:(G.breathOk||0);

  if(G.massage>0)G.massage--;if(G.opioid>0)G.opioid--;if(G.pcea>0)G.pcea--;if(G.pceaCd>0)G.pceaCd--;if(G.eatCd>0)G.eatCd--;if(G.crisisCd>0)G.crisisCd--;if(G.tipCd>0)G.tipCd--;

    G.aguante=clamp(G.aguante-peak/100*8.5+(G.massage>0?1.5:0)+(G.loc==='hospital'?.8:0),0,100);
    G.energy=clamp(G.energy-(G.phase==='activa'?1.1:.6)-(['pie','ducha','pelota'].includes(G.posture)?.4:0),0,100);
  }
  if(G.phase==='latente')endLatent();else if(G.phase==='activa')endActive();else if(G.phase==='pasivo')endPassive();else if(G.phase==='expulsivo')endPushing();

  else if(bo<.35&&G.phase!=='expulsivo'&&G.epi!=='on'&&G.cycles<4)toast('Sigue el círculo: pulsa al crecer, suelta al bajar','var(--amber)');

function babyDrift(){let d=0;

/* ---- fase latente (casa) ---- */
function endLatent(){
  const pm=(POST.prog[G.posture]??1)*(G.energy<25?.7:1);
  G.cm+=(G.multi?.42:.32)*pm*rnd(.8,1.2);G.eff=clamp(50+(G.cm-2)*20,50,100);G.station=clamp(-3+(G.cm-2)*.25,-3,-2);

    if(last.length===2&&last.every(x=>x.i<=(G.multi?8:6)))say('Ya son regulares y seguidas. ¿Nos vamos al hospital?',4500);
    else say(['En la fase latente se está mejor en casa: descansa, bebe y come algo ligero.','La ducha caliente y moverte ayudan mucho ahora.','Mira el móvil: cuenta desde el INICIO de una contracción al INICIO de la siguiente.'][G.cycles%3],4500);}
}
/* ---- fase activa ---- */
function endActive(){

  const before=G.cm;G.cm+=(G.multi?1.5:1)*params().M/60*pm*rnd(.75,1.25);G.eff=clamp(90+(G.cm-5)*3,90,100);
  G.station=Math.max(G.station,clamp(lerp(-2.3,-.6,(G.cm-5)/5)+(['pie','pelota','cuclillas'].includes(G.posture)?.2:0),-3,0));
  if(G.occ==='OP'){const ch={pelota:.25,cuadrupedia:.3,pie:.1,supina:0}[G.posture]??.07;if(Math.random()<ch){G.occ='OA';say('El bebé ha rotado a occipitoanterior: ¡bien! Menos dolor lumbar.',4500,'happy');}}
  if(Math.floor(G.cm)>G.mark.cm){G.mark={cm:Math.floor(G.cm),t:G.t};}
  const thr={5:360,6:300,7:180,8:150,9:120}[G.mark.cm];
  if(thr&&G.t-G.mark.t>thr&&!G.lcg[G.mark.cm]){G.lcg[G.mark.cm]=1;G.queue.push(evLCG);}
  if(!G.ruptured&&G.cm>=6&&Math.random()<.14)G.queue.push(evRotura);
  if(!G.flags.decel&&G.cm>=6.5&&Math.random()<.3){G.flags.decel=1;const ty=(G.baby<45||G.fluid==='teñido'||G.oxy&&Math.random()<.4)?'tardia':Math.random()<.55?'precoz':'variable';G.decel={type:ty,n:0};say('Mira el monitor… vamos a fijarnos en el latido durante las próximas contracciones.',4000,'worry');}
  else if(G.decel&&G.decel.n!==undefined){G.decel.n++;if(G.decel.n===2&&!G.decel.asked){G.decel.asked=1;G.queue.push(evDecel);}}
  if(G.epi==='on'){
    if(G.epiCycles===1&&!G.flags.hypo&&Math.random()<.45){G.flags.hypo=1;G.hypo=true;G.queue.push(evHypo);}
    if(G.epiCycles>=5&&!G.flags.bladder&&Math.random()<.4){G.flags.bladder=1;G.bladder=true;G.queue.push(evBladder);}
    if(G.epiCycles>=9&&!G.flags.fever&&Math.random()<.15){G.flags.fever=1;G.fever=true;G.queue.push(evFever);}}
  if(G.aguante<12&&G.crisisCd<=0&&G.epi==='no'){G.crisisCd=7;G.queue.push(evCrisis);}
  if(G.baby<14&&!G.flags.cs){G.flags.cs=1;G.queue.push(()=>evCesarea('pérdida de bienestar fetal'));}
  if(G.energy<22&&G.tipCd<=0){G.tipCd=4;say('Te veo sin fuerzas: bebe algo o come algo ligero.',4000,'worry');}
  else if(G.posture==='supina'&&G.tipCd<=0){G.tipCd=3;say('Boca arriba el útero comprime la vena cava. Mejor de lado o en vertical.',4500,'worry');}
  else if(G.guided&&G.tipCd<=0){G.tipCd=4;const tips=['Caminar, la pelota y el agua caliente ayudan a dilatar y alivian.','Puedes pedir la epidural cuando quieras: no hay un límite de centímetros.','Las contracciones eficaces suman unas 200 unidades Montevideo: fíjate en el monitor.','Respira con el círculo: inspira 4 s por la nariz, suelta 6 s por la boca.'];if(G.occ==='OP')tips.push('Viene en posterior: la cuadrupedia y la pelota ayudan a que gire.');say(tips[G.cycles%tips.length],4500,'talk');}
  if(G.cm>=10){G.cm=10;G.queue.push(evComplete);}
  else if(Math.floor(before)<Math.floor(G.cm))toast(`${Math.floor(G.cm)} cm`,'var(--cyan)');
}
/* ---- expulsivo ---- */
function endPassive(){
  G.station+=(G.epi==='on'?.24:.34)*((['cama','lateral'].includes(G.posture))?1:1.1)*(G.bladder?.7:1)*rnd(.8,1.2);
  const urgeAt=G.epi==='on'?1:-.3;
  if((G.station>=urgeAt||G.t-G.ts.pasivo>120)&&!G.flags.urge){G.flags.urge=1;G.queue.push(evUrge);}
}
function endPushing(){
  if(G.crown){G.queue.unshift(()=>birth(G.flags.vent?'ventosa':'eutocico'));return;}
  if(G.ex.pushesThis===0){G.station+=.02;if(G.cycles%2===0)say('Aprovecha la contracción: cuando suba, mantén pulsado y empuja soltando el aire.',4000);}
  G.station=Math.min(G.station,2.6);
  if(G.station>=2&&!G.flags.compresas){G.flags.compresas=1;G.queue.push(evCompresas);}
  if(G.station>=2.1&&!G.flags.episio){G.flags.episio=1;G.queue.push(evEpisio);}
  if(G.station>=2.5){G.crown=true;say('¡Se ve la cabeza! Coronación: en la próxima contracción JADEA, no empujes.',5000,'happy');toast('CORONACIÓN','var(--amber)');}
  const R=refs();
  if(!G.flags.vent&&((G.t-G.ts.pasivo>R.expulsivo&&G.station>=1)||(G.baby<25&&G.station>=1))){G.flags.vent=1;G.queue.push(evVentosa);}
  if(!G.flags.cs&&G.station<1&&G.t-G.ts.pasivo>R.expulsivo+60){G.flags.cs=1;G.queue.push(()=>evCesarea('no progresión del expulsivo'));}
  if(G.baby<14&&G.station<1&&!G.flags.cs){G.flags.cs=1;G.queue.push(()=>evCesarea('pérdida de bienestar fetal sin descenso suficiente'));}
  if(G.energy<20&&G.tipCd<=0){G.tipCd=4;say('Entre contracciones, descansa y bebe agua. Los pujos largos agotan.',4000,'worry');}
}

function log(tema,ok,lesson){G.dec.push({tema,ok});if(!ok&&lesson)G.lessons.push(lesson);}
function ask({tag,title,body='',opts,lesson,multi,info}){
  return new Promise(res=>{
    G.modal=true;holdEnd();prompt(false);
    const m=$('modal');m.classList.add('show');
    m.innerHTML=`<div class="mbox"><div class="mtag">${tag||''}</div><h2>${title}</h2>${body?`<p>${body}</p>`:''}
      <div class="opts">${(opts||[]).map((o,i)=>`<button class="opt" data-i="${i}"><span class="l">${multi?'☐':'ABCDE'[i]}</span><span>${o.t}</span></button>`).join('')}</div>
      <div id="mfb"></div><div class="row" id="mrow">${multi?'<button class="btn" id="mConfirm">Confirmar</button>':''}${info?'<button class="btn" id="mGo">Continuar</button>':''}</div></div>`;
    const finish=(ok,fb,val)=>{const f=$('mfb');f.innerHTML=`<div class="fb ${ok?'ok':'ko'}"><strong>${ok?'✓ Correcto. ':'✗ No es lo indicado. '}</strong>${fb}</div>`;
      $('mrow').innerHTML='<button class="btn" id="mGo">Continuar</button>';$('mGo').focus();$('mGo').onclick=()=>{m.classList.remove('show');G.modal=false;res(val);};};
    if(info){$('mGo').onclick=()=>{m.classList.remove('show');G.modal=false;res(0);};return;}
    const btns=[...m.querySelectorAll('.opt')];
    if(multi){const sel=new Set();btns.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel');b.querySelector('.l').textContent=sel.has(i)?'☑':'☐';});
      $('mConfirm').onclick=()=>{const ok=opts.every((o,i)=>!!o.ok===sel.has(i));btns.forEach((b,i)=>{b.disabled=true;if(opts[i].ok)b.classList.add('ok');else if(sel.has(i))b.classList.add('ko');});log(tag,ok,lesson);finish(ok,multi.fb,ok);};return;}
    btns.forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];btns.forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('ok');});if(!o.ok)b.classList.add('ko');log(tag,!!o.ok,o.lesson||lesson);o.fx&&o.fx();finish(!!o.ok,o.fb,+b.dataset.i);});
  });
}

    {t:'Variables: bruscas, en V. Compresión del cordón: cambio de postura y vigilar',ok:ty==='variable',fb:''}];

function decelChart(ty){let f='',t='';for(let x=0;x<=300;x+=3){const p=((x%150)-30)/90;const s=shape(p);let d=0;
  if(ty==='precoz')d=-22*s;if(ty==='tardia'){const q=((x%150)-30)/90-.45;d=-24*Math.sin(Math.PI*clamp(q/.9,0,1));}if(ty==='variable'&&p>.3&&p<.58){const q=(p-.3)/.28;d=-45*(q<.35?q/.35:(1-q)/.65);}

  return `</p><svg class="mchart" viewBox="0 0 300 160"><rect y="${10+(180-160)*.75}" width="300" height="${50*.75}" fill="rgba(166,255,107,.1)"/><path d="${f}" stroke="#FF4F8B" stroke-width="2.2" fill="none"/><path d="${t}" stroke="#4FE3FF" stroke-width="2" fill="none"/><text x="4" y="12" font-size="9" fill="#8EA2B8">FCF</text><text x="4" y="104" font-size="9" fill="#8EA2B8">TOCO</text></svg><p>`;}

/* analgesia */
async function analgesiaMenu(){
  if(G.epi!=='no'){toast('Ya tienes la epidural','var(--muted)');return;}
  const late=G.phase==='expulsivo'&&G.station>=2;
  const r=await ask({tag:'Analgesia',title:'¿Qué opción de alivio quieres?',body:'<b>Epidural</b>: eficacia muy alta, alivio continuo. <b>Óxido nitroso 50 %</b>: moderada, te lo administras tú al empezar la contracción. <b>Petidina</b>: baja-moderada, sin punción, puede deprimir la respiración del recién nacido.',
    opts:[{t:'Epidural',ok:1,fb:late?'Puede no dar tiempo a que haga efecto si el nacimiento es inminente, pero no hay un límite de centímetros.':'Buena elección si la quieres: no aumenta las cesáreas (Cochrane). Puede alargar el expulsivo y aumentar ventosa o fórceps.'},{t:'Óxido nitroso',ok:1,fb:'Autoadministrado, efecto y eliminación rápidos. Puede dar náuseas o mareo.'},{t:'Petidina (opioide)',ok:G.cm<8,fb:G.cm<8?'Alivio moderado sin punción; sedación y náuseas. Lejos del expulsivo es aceptable.':'Cerca del nacimiento puede deprimir la respiración del recién nacido: mejor otra opción.'},{t:'Mejor nada por ahora',ok:1,fb:'Puedes pedir analgesia en cualquier momento.'}]});
  if(r===0)await epiduralFlow();
  if(r===1){G.n2o=true;say('Coge la mascarilla al EMPEZAR cada contracción.',4000);}
  if(r===2){G.opioid=6;if(G.cm>=8)G.opioidLate=true;say('Te ponemos petidina intravenosa.',3500);}
  renderBar();hud();
}
async function epiduralFlow(){
  await ask({tag:'Epidural · 1/3',title:'Antes de la punción, el anestesista necesita… (marca todo lo correcto)',multi:{fb:'Valoración: analítica con coagulación y plaquetas y consentimiento informado; vía venosa y líquidos para prevenir la hipotensión. No hace falta ayuno ni un número de centímetros.'},lesson:'Epidural: analítica con coagulación/plaquetas, consentimiento, vía venosa y sueros.',
    opts:[{t:'Analítica con coagulación y plaquetas',ok:1},{t:'Consentimiento informado',ok:1},{t:'Vía venosa y sueros',ok:1},{t:'Ayuno de 8 horas',ok:0},{t:'Estar de menos de 5 cm',ok:0}]});
  await ask({tag:'Epidural · 2/3',title:'¿Qué postura adoptas para la punción?',
    opts:[{t:'Sentada encorvada (o de lado), espalda curvada «como un gato»',ok:1,fx:()=>setPosture('cama'),fb:'Curvar la espalda abre el espacio entre las apófisis espinosas.'},{t:'Tumbada boca arriba',fb:'Boca arriba no se accede a la espalda: sentada encorvada o de lado.',fx:()=>setPosture('cama')},{t:'De pie, con la espalda recta',fb:'Se necesita la espalda curvada, sentada o de lado.',fx:()=>setPosture('cama')}]});
  await ask({tag:'Epidural · 3/3',title:'¿Dónde se introduce la aguja?',body:'Se deja un catéter fino en el espacio epidural, por fuera de la duramadre (la raquídea sí atraviesa el saco dural).',
    opts:[{t:'Entre L2–L3 o L3–L4',ok:1,fb:'Columna lumbar, entre dos apófisis espinosas. Efecto en 15–20 min; luego bomba o bolos que activa la madre (PCEA).'},{t:'Entre T4–T5 (dorsal alta)',fb:'Se punciona en la zona lumbar: L2–L3 o L3–L4.'},{t:'En el cuello (cervical)',fb:'Se punciona en la zona lumbar: L2–L3 o L3–L4.'}]});
  G.epi='placing';G.cont=true;G.epiCycles=0;if(G.posture!=='lateral')setPosture('cama');
  say('No te muevas durante la próxima contracción mientras colocamos el catéter.',4500,'talk');renderBar();
}

function renderBar(){
  const b=$('bar');if(!G.started){b.innerHTML='';return;}
  const list=ACT.filter(a=>a.ph.includes(G.phase)&&(!a.cond||a.cond()));
  b.innerHTML=list.map((a,i)=>{const dis=(a.noEpi&&G.epi!=='no'&&G.epi!=='placing'?1:0)||(a.cd&&a.cd())||(a.noEpi&&G.epi==='placing');
    return `<button class="act ${a.post&&G.posture===a.post?'cur':''} ${a.hot&&a.hot()?'hot':''}" data-id="${a.id}" ${dis?'disabled':''} title="${a.tip||''}"><span class="k">${i+1<10?i+1:''}</span><span class="ic">${a.ic}</span>${a.t}</button>`;}).join('');
  b.querySelectorAll('.act').forEach(x=>x.onclick=()=>doAct(x.dataset.id));
  const h=$('hold');const push=G.phase==='expulsivo';h.classList.toggle('push',push);h.innerHTML=push?'EMPUJA<small>mantén · ESPACIO</small>':'RESPIRA<small>mantén · ESPACIO</small>';
}
async function doAct(id){if(G.modal||G.over||G.cine)return;const a=ACT.find(x=>x.id===id);if(!a)return;
  if(a.post){if(a.post==='supina'&&!G.flags.supWarn){G.flags.supWarn=1;log('Postura',false,'Evita estar tumbada boca arriba: el útero comprime la vena cava y la dilatación avanza peor.');}
    if(['pie','pelota','ducha','cuadrupedia'].includes(a.post)&&!G.flags.moveOk&&G.phase==='activa'){G.flags.moveOk=1;log('Movimiento libre',true);}
    setPosture(a.post);toast(a.t+(a.tip?' · '+a.tip:''),'var(--cyan)');}
  if(a.run)await a.run();renderBar();hud();}

/* ===================== nacimiento y después ===================== */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function apgarCalc(){let a1,a5;if(G.baby>=70){a1=8;a5=9+(Math.random()<.5?1:0);}else if(G.baby>=45){a1=6;a5=9;}else{a1=4;a5=7;}
  if(G.opioidLate)a1-=1;if(G.type.includes('instrumental'))a1-=1;return [Math.max(2,a1),a5];}
async function birth(kind){
  G.cine=true;prompt(false);G.ts.birth=G.t;
  // desgarro
  let risk=.3*(POST.tear[G.posture]??1)*(1+G.ex.crownPush*.35-Math.min(3,G.ex.pant)*.06)*(G.ex.compresas?.7:1)*(1+G.ex.val*.05)*(G.flags.forceps?1.8:kind==='ventosa'?1.25:1);
  const r=Math.random();G.tear=r<risk*.18?3:r<risk*.9?2:r<risk*1.9?1:0;if(G.ex.episio)G.tear=Math.max(G.tear,2);
  if(G.ex.crownPush>0)log('Coronación',false,'En la coronación se jadea suavemente para frenar la salida de la cabeza y proteger el periné.');else if(G.ex.pant>0)log('Coronación',true);
  $('flash').style.transition='opacity .4s';$('flash').style.opacity=1;await wait(600);
  G.phase='alumbramiento';setPosture('bebe');mwMood('happy');renderBar();
  $('flash').style.transition='opacity 2s';$('flash').style.opacity=0;
  $('ptext').textContent='¡HA NACIDO LEO!';$('psub').textContent=fmtT(G.t)+' · '+G.type;$('ringBox').style.display='none';$('gauge').style.display='none';$('prompt').classList.add('show');
  await wait(2800);$('prompt').classList.remove('show');G.cine=false;
  G.apgar=apgarCalc();
  await postpartum();
}
async function postpartum(){
  const [a1,a5]=G.apgar;
  const cat=a1>=7?0:a1>=4?1:2;
  await ask({tag:'Minuto 1 · Test de Apgar',title:`Leo está sobre tu pecho. Apgar al minuto: ${a1}.`,body:'Se valoran frecuencia cardiaca, respiración, tono, respuesta a estímulos y color. ¿Qué significa?',
    opts:[{t:'7–10: normal. Piel con piel y seguir observando',ok:cat===0,fb:`Puntuación ${a1}. 7–10 normal; 4–6 necesita ayuda (secar y estimular); 0–3 reanimación. A los 5 minutos: ${a5}. La cianosis de manos y pies es habitual.`},
      {t:'4–6: necesita un poco de ayuda: secar y estimular',ok:cat===1,fb:`Puntuación ${a1}. 7–10 normal; 4–6 secar y estimular; 0–3 reanimación. A los 5 minutos: ${a5}.`},
      {t:'0–3: reanimación',ok:cat===2,fb:`Puntuación ${a1}. 7–10 normal; 4–6 secar y estimular; 0–3 reanimación. A los 5 minutos: ${a5}.`}]});
  await cordGame();
  await ask({tag:'Alumbramiento · manejo activo',title:'Para prevenir la hemorragia posparto…',
    opts:[{t:'Oxitocina 10 UI IM o IV tras el nacimiento',ok:1,fx:()=>{G.flags.oxyPP=1;},fb:'La oxitocina profiláctica es el uterotónico de elección para prevenir la hemorragia posparto (OMS).'},{t:'Solo dar algo si sangra mucho',fx:()=>{G.blood+=250;},fb:'Se da de forma profiláctica, no solo si sangra.'},{t:'Tirar fuerte del cordón para que salga ya',fx:()=>{G.blood+=150;},fb:'La tracción controlada es opcional, la hace un profesional entrenado y con contratracción suprapúbica.'}]});
  await ask({tag:'Signos de desprendimiento',title:'¿Qué indica que la placenta se ha desprendido? (marca todos)',multi:{fb:'Signos: pequeña salida de sangre por la vagina, el cordón se alarga y el útero sube y se vuelve globuloso.'},lesson:'Signos de desprendimiento placentario: pequeña salida de sangre, cordón que se alarga, útero que sube y se vuelve globuloso.',
    opts:[{t:'Pequeña salida de sangre por la vagina',ok:1},{t:'El cordón se alarga',ok:1},{t:'El útero sube y se vuelve globuloso',ok:1},{t:'Fiebre',ok:0},{t:'El útero se ablanda y desaparece',ok:0}]});
  G.ts.placenta=G.t+(G.flags.oxyPP?rnd(6,14):rnd(18,32));
  await ask({tag:'Placenta',title:`La placenta sale a los ${Math.round(G.ts.placenta-G.ts.birth)} minutos.`,body:'¿Qué se revisa?',
    opts:[{t:'Que esté íntegra y que el útero quede duro y contraído (globo de seguridad de Pinard)',ok:1,fb:'Placenta íntegra y útero duro a la altura del ombligo: buena hemostasia. Si no sale en 30 min con manejo activo se considera retenida.'},{t:'Nada, ya ha salido',fb:'Hay que comprobar que está íntegra y vigilar el tono uterino.'}]});
  if(!G.flags.oxyPP||Math.random()<.25){
    await ask({tag:'Cuarta etapa',title:'El útero está blando, por encima del ombligo, y sangras más.',
      opts:[{t:'Masaje uterino, uterotónicos y avisar',ok:1,fx:()=>{G.blood+=150;},fb:'Si el útero está blando se masajea para que se contraiga (globo de Pinard).'},{t:'Esperar a ver',fx:()=>{G.blood+=450;},fb:'Útero blando + sangrado = riesgo de hemorragia: masaje uterino y tratamiento inmediato.'}]});}
  const tears=['Periné íntegro','Desgarro de grado I (piel y mucosa)','Desgarro de grado II (músculos del periné)','Desgarro de grado III (esfínter anal)'];
  await ask({tag:'Revisión del periné',title:G.ex.episio?'Episiotomía mediolateral para suturar.':tears[G.tear]+'.',body:'¿Qué se hace?',
    opts:G.tear===0&&!G.ex.episio?[{t:'Revisar y, si está íntegro, no suturar',ok:1,fb:'¡Periné íntegro! Protección del periné, postura y salida lenta ayudan.'},{t:'Suturar por si acaso',fb:'Si está íntegro, no se sutura.'}]
      :G.tear===3?[{t:'Sutura en quirófano y seguimiento del suelo pélvico',ok:1,fb:'Los desgarros III–IV necesitan sutura en quirófano y seguimiento del suelo pélvico.'},{t:'Sutura rápida en la cama sin anestesia',fb:'Los grado III se reparan en quirófano con analgesia adecuada.'}]
      :[{t:'Sutura con anestesia local',ok:1,fb:'Valoración de desgarros y sutura con analgesia adecuada.'},{t:'Sutura sin anestesia',fb:'Siempre con analgesia adecuada.'}]});
  await ask({tag:'Primera hora',title:'Leo está despierto y busca el pecho.',
    opts:[{t:'Piel con piel ininterrumpido y primera toma en la primera hora',ok:1,fb:'Regula temperatura y glucemia y favorece el vínculo. Después: vitamina K 1 mg IM, profilaxis ocular; prueba del talón a partir de las 48 h y cribado auditivo antes del alta.'},{t:'Llevarlo al nido para que descanses',fb:'La primera hora cuenta: piel con piel y lactancia precoz.'},{t:'Bañarlo primero',fb:'El baño puede esperar: primero piel con piel.'}]});
  report();
}
function cordGame(){return new Promise(res=>{
  G.modal=true;const m=$('modal');m.classList.add('show');
  m.innerHTML=`<div class="mbox"><div class="mtag">Cordón umbilical</div><h2>El cordón todavía late. ¿Cuándo lo pinzamos?</h2><p>Pulsa cuando creas que es el momento.</p><div class="cordBar"><i id="cordI"></i></div><p class="num" id="cordT">0 s</p><div class="row"><button class="btn" id="cordBtn">Pinzar y cortar</button></div><div id="cfb"></div></div>`;
  let s=0;const iv=setInterval(()=>{s+=1;$('cordI').style.width=Math.min(100,s/60*100)+'%';$('cordT').textContent=s>=60?'60 s · ha dejado de latir':s+' s';if(s>=60){clearInterval(iv);}},100);
  $('cordBtn').onclick=()=>{clearInterval(iv);const ok=s>=60;log('Pinzamiento del cordón',ok,'Pinzamiento tardío: no antes de 1 minuto (o hasta que deje de latir); mejora las reservas de hierro.');
    $('cfb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><strong>${ok?'✓ Pinzamiento tardío. ':'✗ Demasiado pronto. '}</strong>No antes de 1 minuto (o hasta que deje de latir): mejora las reservas de hierro del bebé. ${ok?'Tu pareja corta el cordón.':''}</div><div class="row" style="margin-top:.6em"><button class="btn" id="cGo">Continuar</button></div>`;
    $('cordBtn').disabled=true;$('cGo').onclick=()=>{m.classList.remove('show');G.modal=false;res();};};
});}

    <div class="card"><span class="lbl">Pérdida de sangre</span><span class="v ${cls(G.blood<500,G.blood<1000)}">${G.blood} ml</span><span class="r">hemorragia ≥ 500 ml (≥ 1.000 en cesárea)</span></div>

    <div class="card"><span class="lbl">Periné</span><span class="v ${cls(G.tear<=1,G.tear===2)}">${G.tear<0?'Cesárea':G.ex.episio?'Episiotomía':tears[G.tear]}</span><span class="r">${G.ex.compresas?'con compresas calientes':'sin compresas'}</span></div>
    <div class="card"><span class="lbl">Pujos</span><span class="v">${G.ex.good} buenos</span><span class="r">${G.ex.val} Valsalva · ${G.ex.weak} cortos</span></div>
    <div class="card"><span class="lbl">Analgesia</span><span class="v" style="font-size:1.1em">${G.epi!=='no'?'Epidural':G.n2o?'Óxido nitroso':G.opioid||G.opioidLate?'Petidina':'Sin fármacos'}</span><span class="r">${G.triage?`${G.triage} visita(s) al triaje antes de tiempo`:'llegada en fase activa'}</span></div>
   </div>
   <div class="grid2">
    <div class="card"><h3>Para repasar</h3>${L.length?`<ul>${L.map(l=>`<li>${l}</li>`).join('')}</ul>`:'<p>¡Ninguna decisión incorrecta! Lo has hecho de libro.</p>'}</div>
    <div class="card"><h3>Mensajes clave</h3><ul><li>La fase latente se pasa mejor en casa; la activa empieza hacia los 5 cm.</li><li>Cada parto tiene su ritmo: la duración por sí sola no obliga a intervenir.</li><li>Moverse, el agua caliente y el acompañamiento continuo reducen el dolor.</li><li>La epidural es eficaz y segura; conocer sus efectos ayuda a decidir.</li><li>Piel con piel, pinzamiento tardío y lactancia precoz: la primera hora cuenta.</li><li>Sangrado, líquido teñido, fiebre o menos movimientos: acudir sin esperar.</li></ul></div>
   </div>
   <div class="row"><button class="btn" id="again">Jugar otra vez</button><span class="r" style="color:var(--muted);font-size:.8em">Material divulgativo basado en OMS 2018/2020, GPC Ministerio de Sanidad, FIGO, Cochrane y SEGO. No sustituye la valoración de tu matrona, obstetra o anestesista.</span></div>
  </div>`;
  $('again').onclick=()=>titleScreen();
}

/* ===================== pantalla de título ===================== */
let pick={profile:'primi',guided:true};
function titleScreen(){
  G.started=false;G.over=false;const s=$('screen');s.classList.add('show');
  s.innerHTML=`<div class="scr"><div class="lbl">Simulador · preparación al parto</div><h1 class="title">PARITORIO<br><span>en primera persona</span></h1>
   <p class="sub">Eres tú quien está de parto. Desde las primeras contracciones en casa hasta la primera toma de Leo: respira, muévete, decide cuándo ir al hospital, pide (o no) la epidural, lee el monitor y empuja en el momento justo.</p>
   <div class="grid2">
    <div class="card"><h3>Cómo se juega</h3><ul>
      <li><b>Respirar:</b> durante cada contracción, mantén pulsado <kbd>ESPACIO</kbd> o el botón RESPIRA mientras el círculo crece y suéltalo cuando baja. Bien hecho, duele menos.</li>
      <li><b>Acciones:</b> entre contracciones elige postura y cuidados (teclas <kbd>1</kbd>–<kbd>9</kbd>).</li>
      <li><b>Expulsivo:</b> con la contracción, mantén EMPUJA y suelta en la zona verde. En la coronación, <kbd>J</kbd> para jadear.</li>
      <li>Vigila dolor, aguante, energía y el bienestar del bebé en el monitor.</li><li>Pantalla completa: botón ⛶ o tecla <kbd>F</kbd>. En iPhone, añádelo a la pantalla de inicio.</li></ul></div>
    <div class="card"><h3>Tu partida</h3>
      <div class="lbl">Perfil</div><div class="seg" id="sProf"><button data-v="primi" class="${pick.profile==='primi'?'on':''}">Primer parto</button><button data-v="multi" class="${pick.profile==='multi'?'on':''}">Ya he parido antes</button></div>
      <div class="lbl">Ayuda</div><div class="seg" id="sGuide"><button data-v="1" class="${pick.guided?'on':''}">Con consejos</button><button data-v="0" class="${!pick.guided?'on':''}">Modo experto</button></div>
      <p style="color:var(--muted);font-size:.8em">Cada contracción que juegas representa varios minutos de parto: el reloj avanza acelerado.</p>
      <div class="row"><button class="btn" id="start" style="font-size:1.2em;padding:.7em 1.6em">EMPEZAR ▶</button><button class="btn alt" id="full2">⛶ Pantalla completa</button></div></div>
   </div></div>`;
  s.querySelectorAll('#sProf button').forEach(b=>b.onclick=()=>{pick.profile=b.dataset.v;titleScreen();});
  s.querySelectorAll('#sGuide button').forEach(b=>b.onclick=()=>{pick.guided=b.dataset.v==='1';titleScreen();});
  $('start').onclick=start;$('full2').onclick=toggleFull;$('full2').textContent=isFull()?'Salir de pantalla completa':'⛶ Pantalla completa';
  newGame(pick.profile,pick.guided);drawScene();hud();
}
function start(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(e){}
  newGame(pick.profile,pick.guided);$('screen').classList.remove('show');G.started=true;
  setPosture('sofa');fitCanvas();renderBar();hud();
  // contracciones previas en el móvil
  for(let i=0;i<2;i++)G.intervals.push({t:G.t-30*(2-i),i:Math.round(rnd(12,18)),d:Math.round(rnd(25,32))});phoneRows();
  ask({tag:'17:10 · En casa · semana 40',title:'Llevas un rato con contracciones.',body:'Son irregulares y las apuntas en el móvil. Tu pareja está contigo. Cuando llegue una contracción, <b>mantén pulsado RESPIRA mientras el círculo crece</b> y suéltalo cuando baje. Entre contracciones elige qué hacer. Tú decides cuándo ir al hospital.',info:1});
}

/* ===================== bucle e input ===================== */
let last=performance.now(),hudT=0,simT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.started&&!G.paused&&!G.modal&&!G.over){tick(dt);}
  if(G.started&&!G.paused){simT+=dt;monStep(G.modal||G.over?dt*.3:dt*(G.speed||1),simT);}
  monDraw();
  // efectos de cámara
  const c=G.cyc||{st:'p',t:0};const pr=G.started&&G.phase&&!['alumbramiento','puerperio'].includes(G.phase)?params():null;
  const s=pr&&c.st==='c'?shape(c.t/pr.C):0;const pi=(G.pain||0)/100;
  $('vig').style.opacity=(s*pi*.95).toFixed(3);
  const sh=s*pi*6;$('shake').setAttribute('transform',`translate(${(Math.random()-.5)*sh},${(Math.random()-.5)*sh+Math.sin(now/1400)*3})`);
  $('scene').style.filter=G.posture==='supina'&&G.phase==='activa'?'blur(1.2px) saturate(.85)':s*pi>.7?`blur(${((s*pi-.7)*4).toFixed(2)}px)`:'none';
  if(pr){$('ctxFill').style.width=(c.st==='c'?s*100*pr.amp:0)+'%';$('ctxState').textContent=c.st==='c'?(s>.6?'PICO':c.t/pr.C<.5?'Subiendo':'Bajando'):'En reposo';$('ctxState').style.color=c.st==='c'?'var(--pink)':'var(--muted)';
    $('ctxNext').textContent=c.st==='p'?`Siguiente en ${Math.max(0,pr.P-c.t).toFixed(1)} s · ${cycleInfo().txt}`:cycleInfo().txt;$('dynTxt').textContent=cycleInfo().txt.split(' · ').slice(-1)[0];}
  hudT+=dt;if(hudT>.12&&G.started){hudT=0;hud();if(G.phase==='latente'||G.phase==='activa'){const b=document.querySelector('[data-id="hosp"]');}}
  requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{if(e.repeat)return;
  if(e.code==='Space'){e.preventDefault();if(!G.modal)holdStart();}
  else if(e.code==='KeyJ')pant();
  else if(e.code==='KeyP')togglePause();
  else if(/^Digit[1-9]$/.test(e.code)&&!G.modal){const b=$('bar').querySelectorAll('.act')[+e.code.slice(5)-1];b&&!b.disabled&&b.click();}
  else if(e.code==='Enter'&&G.modal){const g=$('mGo')||$('cGo');g&&g.click();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();holdEnd();}});
const hb=$('hold');hb.addEventListener('pointerdown',e=>{e.preventDefault();hb.setPointerCapture(e.pointerId);holdStart();});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hb.addEventListener(ev,()=>holdEnd()));
$('pant').addEventListener('pointerdown',e=>{e.preventDefault();pant();});
function togglePause(){if(!G.started||G.over)return;G.paused=!G.paused;$('bPause').textContent=G.paused?'▶ Seguir':'II Pausa';$('bPause').classList.toggle('on',G.paused);}
$('bPause').onclick=togglePause;
/* pantalla completa */
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement)||isStandalone();
function canFull(){const d=document.documentElement;return !!(d.requestFullscreen||d.webkitRequestFullscreen)&&(document.fullscreenEnabled!==false||document.webkitFullscreenEnabled);}
async function toggleFull(){
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  if(isStandalone())return;
  const d=document.documentElement;
  try{ if(!canFull())throw 0; await (d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen());
    try{await screen.orientation.lock('landscape');}catch(e){} }
  catch(e){fullHelp();}
}
function fullHelp(){
  const wasModal=G.modal;G.modal=true;const m=$('modal');m.classList.add('show');
  const ios=/iPhone|iPod/.test(navigator.userAgent)||(/Mac/.test(navigator.userAgent)&&navigator.maxTouchPoints>1&&screen.width<700);
  m.innerHTML=`<div class="mbox"><div class="mtag">Pantalla completa</div><h2>${ios?'En el iPhone, añádelo a la pantalla de inicio':'Este navegador no deja ponerlo a pantalla completa desde aquí'}</h2>
   ${ios?`<p>Safari no permite pantalla completa en páginas web del iPhone, pero sí al abrirlo como app:</p><ol style="margin:0;padding-left:1.3em;line-height:1.6"><li>Abre el juego en <b>Safari</b>.</li><li>Pulsa el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li><li>Elige <b>Añadir a pantalla de inicio</b> y pulsa <b>Añadir</b>.</li><li>Abre el juego desde el icono nuevo: se verá a pantalla completa, sin barras.</li></ol><p>Juega con el móvil en horizontal.</p>`
   :`<p>Ábrelo en su propia pestaña (no dentro de otra página) y vuelve a pulsar ⛶, o usa la tecla <kbd>F11</kbd> en el ordenador. En Android, desde el menú ⋮ del navegador puedes elegir <b>Añadir a pantalla de inicio</b>.</p>`}
   <div class="row"><button class="btn" id="fhOk">Entendido</button></div></div>`;
  $('fhOk').onclick=()=>{m.classList.remove('show');G.modal=wasModal;};
}
function fullUi(){const f=isFull();$('bFull').textContent=f&&!isStandalone()?'⤢':'⛶';$('bFull').classList.toggle('on',f);$('bFull').style.display=isStandalone()?'none':'';const f2=$('full2');if(f2){f2.style.display=isStandalone()?'none':'';f2.textContent=f?'Salir de pantalla completa':'⛶ Pantalla completa';}setTimeout(fitCanvas,200);}
$('bFull').onclick=toggleFull;
document.addEventListener('fullscreenchange',fullUi);document.addEventListener('webkitfullscreenchange',fullUi);
window.addEventListener('keydown',e=>{if(e.code==='KeyF'&&!G.modal)toggleFull();});
$('bSpeed').onclick=()=>{G.speed=G.speed===1?2:1;$('bSpeed').textContent='x'+G.speed;$('bSpeed').classList.toggle('on',G.speed>1);};
$('bSound').onclick=()=>{sound=!sound;$('bSound').classList.toggle('on',sound);};
$('bSkip').onclick=()=>{if(G.cyc&&G.cyc.st==='p')G.cyc.skip=true;};
window.addEventListener('resize',()=>{fitCanvas();checkRot();});
function checkRot(){const p=innerHeight>innerWidth&&innerWidth<820;$('rot').classList.toggle('show',p&&!window._rotOk);}
$('rotOk').onclick=()=>{window._rotOk=1;checkRot();};
titleScreen();fitCanvas();checkRot();fullUi();requestAnimationFrame(loop);
</script>
</body>
</html>
